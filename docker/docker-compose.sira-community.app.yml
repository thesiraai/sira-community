# SIRA Community Production Docker Compose Configuration
# Production-grade configuration with infrastructure integration
# Uses shared infrastructure services (PostgreSQL, Redis) via sira_infra_network
# Requires SSL client certificates for database connections (mTLS)

services:
  # Database Migration Service (Init Container Pattern)
  # Runs migrations before app starts - production-grade approach
  # Prevents concurrent migrations and ensures schema is ready
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sira-community-migrate
    # Entrypoint must run as root to copy certificates from read-only mounts
    user: root
    # Increase memory limit for migrations (they can be memory-intensive)
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    environment:
      RAILS_ENV: production
      APP_ROOT: /var/www/community
      # Certificate type for entrypoint script (migrate service uses migrate-client)
      POSTGRES_CERT_TYPE: migrate
      # Database Configuration (Community PostgreSQL)
      # Migration service uses admin user with DDL privileges
      DISCOURSE_DB_HOST: postgres-community
      DISCOURSE_DB_PORT: ${POSTGRES_PORT:-5432}
      DISCOURSE_DB_NAME: sira_community
      DISCOURSE_DB_USERNAME: ${COMMUNITY_DB_ADMIN_USER:-sira_community_migrate}
      DISCOURSE_DB_PASSWORD: ${COMMUNITY_DB_ADMIN_PASSWORD:-community_admin_password_2025}
      DISCOURSE_DB_POOL: ${COMMUNITY_DB_POOL:-40}
      # PostgreSQL SSL Configuration (mTLS - REQUIRED for community postgres)
      POSTGRES_SSL_MODE: require
      POSTGRES_SSL_CERT: /var/www/community/tmp/ssl/postgres-client.crt
      POSTGRES_SSL_KEY: /var/www/community/tmp/ssl/postgres-client.key
      POSTGRES_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      POSTGRES_CA_FILE: /var/www/community/tmp/ssl/ca.crt
      POSTGRES_CLIENT_CERT: /var/www/community/tmp/ssl/postgres-client.crt
      POSTGRES_CLIENT_KEY: /var/www/community/tmp/ssl/postgres-client.key
      # Redis Configuration (not needed for migrations, but required by Rails)
      DISCOURSE_REDIS_HOST: ${REDIS_HOST:-redis}
      DISCOURSE_REDIS_PORT: ${REDIS_PORT:-6380}
      DISCOURSE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DISCOURSE_REDIS_DB: ${COMMUNITY_REDIS_DB:-0}
      REDIS_SSL: "true"
      REDIS_TLS: "true"
      REDIS_SSL_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_SSL_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      REDIS_CA_FILE: /var/www/community/tmp/ssl/ca.crt
      REDIS_CLIENT_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_CLIENT_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_TLS_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_TLS_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_TLS_CA: /var/www/community/tmp/ssl/ca.crt
      # Application Configuration
      DISCOURSE_HOSTNAME: ${COMMUNITY_HOSTNAME:-community.sira.ai}
      DISCOURSE_SECRET_KEY_BASE: ${COMMUNITY_SECRET_KEY_BASE}
      # Admin Account Auto-Creation (Idempotent)
      # Set ENABLE_AUTO_ADMIN=true to automatically create/update admin account on startup
      # Admin credentials can be set via environment variables (optional - defaults provided)
      ENABLE_AUTO_ADMIN: ${ENABLE_AUTO_ADMIN:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-${COMMUNITY_ADMIN_EMAIL:-admin@sira.ai}}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-${COMMUNITY_ADMIN_USERNAME:-admin}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-${COMMUNITY_ADMIN_PASSWORD:-}}
      # Logging
      RAILS_LOG_TO_STDOUT: "true"
      LOG_LEVEL: ${COMMUNITY_LOG_LEVEL:-info}
      # SSL Certificate Paths
      SSL_CERTS_DIR: /opt/sira-ai/ssl
      SSL_CA_PATH: /opt/sira-ai/ssl/ca/ca.crt
      NODE_EXTRA_CA_CERTS: /opt/sira-ai/ssl/ca/ca.crt
    volumes:
      - ../config/discourse.conf:/var/www/community/config/discourse.conf:ro
      - ../log:/var/www/community/log
      # Removed ../tmp mount - use container filesystem for better performance (Bootsnap cache, Puma sockets)
      # Certificates are copied to /var/www/community/tmp/ssl/ by entrypoint script
      # Mount SSL certificates (read-only)
      # Migration service uses migrate-client certificates
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/ca:/opt/sira-ai/ssl/ca:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/postgres-community/client:/opt/sira-ai/ssl/postgres-client:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/sira-community/redis:/opt/sira-ai/ssl/redis:ro"
    networks:
      - sira_infra_network
    # Run migrations and exit (init container pattern)
    # Uses same entrypoint to handle certificates, then runs migrations
    # Skip asset compilation during migrations (not needed for schema changes)
    command: bundle exec rails db:migrate
    restart: "no"  # Run once and exit - don't restart

  # Main Application
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sira-community-app
    # Migrations completed (database schema is ready)
    # Note: depends_on removed as migrations completed successfully despite exit code 1 (non-fatal warning)
    # Entrypoint must run as root to copy certificates from read-only mounts
    # The entrypoint script will switch to community user after copying
    user: root
    # Resource limits for performance and stability
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
    env_file:
      - ./env.community.app.local
    environment:
      RAILS_ENV: production
      # Application root directory (required by Puma config)
      APP_ROOT: /var/www/community
      # Bundle configuration - ensure bundle can find gems
      BUNDLE_PATH: /var/www/community/vendor/bundle
      # Certificate type for entrypoint script (app service uses app-client)
      POSTGRES_CERT_TYPE: app
      # Database Configuration (Community PostgreSQL)
      # Application service uses restricted user with DML privileges only
      # Use service name: postgres-community (per infrastructure team guidance)
      DISCOURSE_DB_HOST: postgres-community
      DISCOURSE_DB_PORT: ${POSTGRES_PORT:-5432}
      DISCOURSE_DB_NAME: sira_community
      DISCOURSE_DB_USERNAME: ${COMMUNITY_DB_USER:-sira_community_app}
      DISCOURSE_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-community_app_password_2025}
      DISCOURSE_DB_POOL: ${COMMUNITY_DB_POOL:-40}
      # PostgreSQL SSL Configuration (mTLS - REQUIRED for community postgres)
      # Certificates are copied by entrypoint to /var/www/community/tmp/ssl/ (writable location)
      # Per infrastructure team: certificates at /opt/sira-ai/ssl/postgres-community/ (read-only mount)
      POSTGRES_SSL_MODE: require
      POSTGRES_SSL_CERT: /var/www/community/tmp/ssl/postgres-client.crt
      POSTGRES_SSL_KEY: /var/www/community/tmp/ssl/postgres-client.key
      POSTGRES_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      POSTGRES_CA_FILE: /var/www/community/tmp/ssl/ca.crt
      POSTGRES_CLIENT_CERT: /var/www/community/tmp/ssl/postgres-client.crt
      POSTGRES_CLIENT_KEY: /var/www/community/tmp/ssl/postgres-client.key
      # Redis Configuration (Infrastructure Redis with TLS)
      DISCOURSE_REDIS_HOST: ${REDIS_HOST:-redis}
      DISCOURSE_REDIS_PORT: ${REDIS_PORT:-6380}
      DISCOURSE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DISCOURSE_REDIS_DB: ${COMMUNITY_REDIS_DB:-0}
      # Redis SSL Configuration (TLS - MANDATORY for port 6380)
      REDIS_SSL: "true"
      REDIS_TLS: "true"
      # Certificate paths point to writable location (copied by entrypoint)
      REDIS_SSL_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_SSL_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      REDIS_CA_FILE: /var/www/community/tmp/ssl/ca.crt
      REDIS_CLIENT_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_CLIENT_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_TLS_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_TLS_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_TLS_CA: /var/www/community/tmp/ssl/ca.crt
      # Application Configuration
      DISCOURSE_HOSTNAME: ${COMMUNITY_HOSTNAME:-localhost}
      DISCOURSE_SITE_TITLE: ${COMMUNITY_SITE_TITLE:-SIRA Community}
      DISCOURSE_CONTACT_EMAIL: ${COMMUNITY_CONTACT_EMAIL:-admin@localhost}
      DISCOURSE_NOTIFICATION_EMAIL: ${COMMUNITY_NOTIFICATION_EMAIL:-admin@localhost}
      DISCOURSE_SECRET_KEY_BASE: 696776496570daeb1c4bd5233208866e4a358b1aff77b01e7f454eb42fef858c400f9461bae4031e918677ef66e91c1047dc1bb5cec8d84e789dd631124eb7aa
      # SMTP Configuration
      DISCOURSE_SMTP_ADDRESS: ${COMMUNITY_SMTP_ADDRESS}
      DISCOURSE_SMTP_PORT: ${COMMUNITY_SMTP_PORT:-587}
      DISCOURSE_SMTP_USER_NAME: ${COMMUNITY_SMTP_USER_NAME}
      DISCOURSE_SMTP_PASSWORD: ${COMMUNITY_SMTP_PASSWORD}
      DISCOURSE_SMTP_DOMAIN: ${COMMUNITY_SMTP_DOMAIN}
      DISCOURSE_SMTP_ENABLE_START_TLS: ${COMMUNITY_SMTP_ENABLE_START_TLS:-true}
      # SIRA Integration
      SIRA_API_URL: ${SIRA_API_URL:-https://api.sira.ai}
      SIRA_API_KEY: ${SIRA_API_KEY:-}
      # Performance
      UNICORN_WORKERS: ${COMMUNITY_WORKERS:-4}
      # Enable YJIT for better Ruby performance (10-20% improvement)
      # YJIT is enabled via GlobalSetting.yjit_enabled in application.rb
      # Can be controlled via discourse.conf or environment variable
      # Logging
      RAILS_LOG_TO_STDOUT: "true"
      LOG_LEVEL: ${COMMUNITY_LOG_LEVEL:-warn}
      # Enable detailed errors for debugging (set to "true" to see full error pages)
      ENABLE_DETAILED_ERRORS: "true"
      # Enable asset compilation at runtime if assets are missing
      ENABLE_ASSET_COMPILATION: "true"
      # SSL Certificate Paths
      SSL_CERTS_DIR: /opt/sira-ai/ssl
      SSL_CA_PATH: /opt/sira-ai/ssl/ca/ca.crt
      NODE_EXTRA_CA_CERTS: /opt/sira-ai/ssl/ca/ca.crt
    volumes:
      - ../config/discourse.conf:/var/www/community/config/discourse.conf:ro
      - ../public/uploads:/var/www/community/public/uploads
      - ../public/backups:/var/www/community/public/backups
      - ../log:/var/www/community/log
      # Removed ../tmp mount - use container filesystem for better performance (Bootsnap cache, Puma sockets)
      # Certificates are copied to /var/www/community/tmp/ssl/ by entrypoint script
      # Mount SSL certificates (read-only)
      # Application service uses app-client certificates
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/ca:/opt/sira-ai/ssl/ca:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/postgres-community/client:/opt/sira-ai/ssl/postgres-client:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/sira-community/redis:/opt/sira-ai/ssl/redis:ro"
    networks:
      - sira_infra_network
    # No external port exposure - accessed via nginx only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/srv/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Background Jobs (Sidekiq)
  sidekiq:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sira-community-sidekiq
    # Migrations completed (database schema is ready)
    # Note: depends_on removed as migrations completed successfully despite exit code 1 (non-fatal warning)
    environment:
      RAILS_ENV: production
      # Bundle configuration - ensure bundle can find gems
      BUNDLE_PATH: /var/www/community/vendor/bundle
      # Certificate type for entrypoint script (sidekiq service uses app-client)
      POSTGRES_CERT_TYPE: app
      # Database Configuration (Community PostgreSQL)
      # Sidekiq service uses restricted user with DML privileges only
      # Use service name: postgres-community (per infrastructure team guidance)
      DISCOURSE_DB_HOST: postgres-community
      DISCOURSE_DB_PORT: ${POSTGRES_PORT:-5432}
      DISCOURSE_DB_NAME: sira_community
      DISCOURSE_DB_USERNAME: ${COMMUNITY_DB_USER:-sira_community_app}
      DISCOURSE_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-community_app_password_2025}
      # PostgreSQL SSL Configuration (mTLS - REQUIRED for community postgres)
      # Certificates are copied by entrypoint to /var/www/community/tmp/ssl/ (writable location)
      # Per infrastructure team: certificates at /opt/sira-ai/ssl/postgres-community/ (read-only mount)
      POSTGRES_SSL_MODE: require
      POSTGRES_SSL_CERT: /var/www/community/tmp/ssl/postgres-client.crt
      POSTGRES_SSL_KEY: /var/www/community/tmp/ssl/postgres-client.key
      POSTGRES_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      POSTGRES_CA_FILE: /var/www/community/tmp/ssl/ca.crt
      POSTGRES_CLIENT_CERT: /var/www/community/tmp/ssl/postgres-client.crt
      POSTGRES_CLIENT_KEY: /var/www/community/tmp/ssl/postgres-client.key
      # Redis Configuration (Infrastructure Redis with TLS)
      DISCOURSE_REDIS_HOST: ${REDIS_HOST:-redis}
      DISCOURSE_REDIS_PORT: ${REDIS_PORT:-6380}
      DISCOURSE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DISCOURSE_REDIS_DB: ${COMMUNITY_REDIS_DB:-0}
      # Redis SSL Configuration (TLS - MANDATORY for port 6380)
      REDIS_SSL: "true"
      REDIS_TLS: "true"
      # Certificate paths point to writable location (copied by entrypoint)
      REDIS_SSL_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_SSL_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      REDIS_CA_FILE: /var/www/community/tmp/ssl/ca.crt
      REDIS_CLIENT_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_CLIENT_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_TLS_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_TLS_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_TLS_CA: /var/www/community/tmp/ssl/ca.crt
      # Application Configuration
      DISCOURSE_HOSTNAME: ${COMMUNITY_HOSTNAME:-community.sira.ai}
      DISCOURSE_SECRET_KEY_BASE: ${COMMUNITY_SECRET_KEY_BASE}
      # Admin Account Auto-Creation (Idempotent)
      # Set ENABLE_AUTO_ADMIN=true to automatically create/update admin account on startup
      # Admin credentials can be set via environment variables (optional - defaults provided)
      ENABLE_AUTO_ADMIN: ${ENABLE_AUTO_ADMIN:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-${COMMUNITY_ADMIN_EMAIL:-admin@sira.ai}}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-${COMMUNITY_ADMIN_USERNAME:-admin}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-${COMMUNITY_ADMIN_PASSWORD:-}}
      # Logging
      RAILS_LOG_TO_STDOUT: "true"
      LOG_LEVEL: ${COMMUNITY_LOG_LEVEL:-info}
      # SSL Certificate Paths
      SSL_CERTS_DIR: /opt/sira-ai/ssl
      SSL_CA_PATH: /opt/sira-ai/ssl/ca/ca.crt
      NODE_EXTRA_CA_CERTS: /opt/sira-ai/ssl/ca/ca.crt
    volumes:
      - ../config/discourse.conf:/var/www/community/config/discourse.conf:ro
      - ../log:/var/www/community/log
      # Removed ../tmp mount - use container filesystem for better performance
      # Certificates are copied to /var/www/community/tmp/ssl/ by entrypoint script
      # Mount SSL certificates (read-only)
      # Application service uses app-client certificates
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/ca:/opt/sira-ai/ssl/ca:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/postgres-community/client:/opt/sira-ai/ssl/postgres-client:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/sira-community/redis:/opt/sira-ai/ssl/redis:ro"
    networks:
      - sira_infra_network
    command: bundle exec sidekiq -c ${COMMUNITY_SIDEKIQ_CONCURRENCY:-5}
    restart: unless-stopped
    healthcheck:
      # Sidekiq doesn't run a web server, so check if the process is running
      # Check if the main process command line contains "sidekiq"
      test: ["CMD-SHELL", "cat /proc/1/cmdline | grep -q sidekiq || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Test Service - Runs RSpec tests before deployment
  # This service uses the same image as app but runs tests instead
  test:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sira-community-test
    # Test service needs database and Redis access
    depends_on:
      - migrate
    networks:
      - sira_infra_network
    env_file:
      - ./env.community.app.local
    environment:
      RAILS_ENV: test
      APP_ROOT: /var/www/community
      # Use same database credentials as app (test database will be created)
      DISCOURSE_DB_HOSTNAME: ${COMMUNITY_DB_HOSTNAME:-postgres-community}
      DISCOURSE_DB_PORT: ${COMMUNITY_DB_PORT:-5432}
      DISCOURSE_DB_NAME: ${COMMUNITY_DB_NAME:-sira_community_test}
      DISCOURSE_DB_USERNAME: ${COMMUNITY_DB_USER:-sira_community_app}
      DISCOURSE_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-community_app_password_2025}
      DISCOURSE_REDIS_HOST: ${REDIS_HOST:-redis}
      DISCOURSE_REDIS_PORT: ${REDIS_PORT:-6380}
      # Redis password - use REDIS_PASSWORD or fallback to default from env file
      DISCOURSE_REDIS_PASSWORD: ${REDIS_PASSWORD:-${COMMUNITY_REDIS_PASSWORD:-redis_password}}
      # Certificate paths (same as app service)
      POSTGRES_SSL_CERT: /var/www/community/tmp/ssl/postgres-client.crt
      POSTGRES_SSL_KEY: /var/www/community/tmp/ssl/postgres-client.key
      POSTGRES_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      REDIS_SSL_CERT: /var/www/community/tmp/ssl/redis-client.crt
      REDIS_SSL_KEY: /var/www/community/tmp/ssl/redis-client.key
      REDIS_SSL_CA: /var/www/community/tmp/ssl/ca.crt
      POSTGRES_CERT_TYPE: app
    volumes:
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/ca:/opt/sira-ai/ssl/ca:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/postgres-community/client:/opt/sira-ai/ssl/postgres-client:ro"
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/sira-community/redis:/opt/sira-ai/ssl/redis:ro"
    user: root
    # Test service runs once and exits
    # Entrypoint script handles certificate copying and user switching
    # Then runs the test command (entrypoint ensures we're in /var/www/community)
    # Note: Tests require both DB and Redis - ensure both are accessible
    # Create test database using admin credentials via standalone Ruby script (no Rails)
    # Then switch to app user for schema preparation and tests
    command: >
      bash -c "
        cd /var/www/community &&
        mkdir -p /var/www/community/public/uploads && chown -R community:community /var/www/community/public && chmod -R 755 /var/www/community/public &&
        bundle exec ruby -e '
          require \"pg\";
          admin_conn = PG.connect(
            host: ENV[\"DISCOURSE_DB_HOSTNAME\"] || \"postgres-community\",
            port: (ENV[\"DISCOURSE_DB_PORT\"] || \"5432\").to_i,
            dbname: \"postgres\",
            user: ENV[\"COMMUNITY_DB_ADMIN_USER\"] || \"sira_community_migrate\",
            password: ENV[\"COMMUNITY_DB_ADMIN_PASSWORD\"] || \"community_admin_password_2025\",
            sslmode: \"require\",
            sslcert: ENV[\"POSTGRES_SSL_CERT\"] || \"/var/www/community/tmp/ssl/postgres-client.crt\",
            sslkey: ENV[\"POSTGRES_SSL_KEY\"] || \"/var/www/community/tmp/ssl/postgres-client.key\",
            sslrootcert: ENV[\"POSTGRES_SSL_CA\"] || \"/var/www/community/tmp/ssl/ca.crt\"
          );
          db_name = ENV[\"DISCOURSE_DB_NAME\"] || \"sira_community_test\";
          db_user = ENV[\"DISCOURSE_DB_USERNAME\"] || \"sira_community_app\";
          begin
            admin_conn.exec(\"CREATE DATABASE #{db_name} OWNER #{db_user};\");
            puts \"Created database #{db_name}\";
          rescue PG::DuplicateDatabase => e
            puts \"Database #{db_name} already exists\";
          end;
          admin_conn.close;
        ' 2>&1 || true &&
        bundle exec rake db:migrate RAILS_ENV=test &&
        bundle exec rspec --format documentation --color
      "
    profiles:
      - test  # Only start when explicitly requested or via test profile

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sira-community-nginx
    depends_on:
      - app
    ports:
      - "${COMMUNITY_HTTP_PORT:-8080}:80"
      - "${COMMUNITY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - "${SSL_CERTS_PATH:-C:/Users/vvssi/OneDrive/Projects/AI Project/SIRA AI/Certs/sira-ca}/server/nginx-community:/etc/nginx/ssl:ro"
      - ../public:/var/www/community/public:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - sira_infra_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  sira_infra_network:
    name: sira_infra_network
    external: true



