# SIRA Community - Discourse Nginx Configuration (Local Production-Grade)
# HTTPS reverse proxy in front of the Discourse Docker container

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # NOTE: Global rate limiting was causing 503s for asset sourcemaps during page load.
    # For local and early-stage deployments, we disable it to avoid false positives.
    # In production, re-enable with carefully tuned limits and exclusions for static assets.
    # limit_req_zone $binary_remote_addr zone=basic_limit:10m rate=10r/s;

    # Upstream Discourse application (Docker service name)
    upstream discourse {
        server discourse:3000;
        keepalive 64;
    }

    # HTTP server - redirect all traffic to HTTPS
    server {
        listen 80;
        server_name local.community.sira.ai;

        # Allow Let's Encrypt challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS with explicit port 8443
        location / {
            return 301 https://$server_name:8443$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name local.community.sira.ai;

        # SSL configuration
        # NOTE: These are expected to be mounted into the container at /etc/nginx/ssl-certs
        ssl_certificate /etc/nginx/ssl-certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl-certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Rate limiting disabled for local deployment (see note above).
        # limit_req zone=basic_limit burst=20 nodelay;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Always present the canonical host to Discourse (avoids hostname enforcement issues)
        # Include port in Host header so Discourse uses it for redirects
        proxy_set_header Host local.community.sira.ai:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host local.community.sira.ai:8443;
        # Tell Discourse the external port is 8443 (not 443) so URLs include :8443
        proxy_set_header X-Forwarded-Port 8443;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Static assets
        location /assets/ {
            proxy_pass http://discourse;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Uploads
        location /uploads/ {
            proxy_pass http://discourse;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public";
        }

        # Main application
        location / {
            proxy_pass http://discourse;
            proxy_buffering off;
        }
    }
}


